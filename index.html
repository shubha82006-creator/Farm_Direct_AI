function register(){return `<button class="back" onclick="screen('roles')">← ${t("back")}</button><div class="steps"><span class="step on">1. ${t("farmer")}</span><span class="step">2. ${t("listing")}</span><span class="step">3. AI</span><span class="step">4. ${t("orders")}</span><span class="step">5. Logistics</span><span class="step">6. Payment</span></div><div class="card"><div class="title"><div><h2>${t("farmer")} Registration & Verification</h2><p>Verified profile for transparent direct trade.</p></div><button class="icon" onclick="toggleVoice()">🎙️</button></div><div class="grid two"><div><label>${t("name")}</label><input id="fname"></div><div><label>${t("phone")}</label><input id="fphone" inputmode="numeric"></div><div><label>${t("loc")}</label><input id="floc"></div><div><label>Verification</label><select><option>Verified by Farm Direct AI</option><option>FPO Verified</option></select></div></div><div class="banner" style="margin-top:18px">✓ Verified farmer profile • Voice-first assistance available</div><div class="actions-row"><button class="btn primary" onclick="saveFarmer()">${t("register")} →</button></div></div>`}

function listing(){let a=s.ai||{};return `<button class="back" onclick="screen('register')">← ${t("back")}</button><div class="steps"><span class="step done">✓ ${t("farmer")}</span><span class="step on">2. ${t("listing")}</span><span class="step">3. AI</span><span class="step">4. ${t("orders")}</span><span class="step">5. Logistics</span><span class="step">6. Payment</span></div><div class="card"><div class="title"><div><h2>${t("listing")}</h2><p>Enter your crop, quantity and location.</p></div><button class="icon" onclick="toggleVoice()">🎙️</button></div><div class="grid two"><div><label>${t("crop")}</label><select id="crop">${Object.keys(crops).map(c=>`<option ${a.crop===c?"selected":""}>${c}</option>`).join("")}</select></div><div><label>${t("qty")}</label><input id="q" type="number" min="1" value="${a.qty||50}"></div><div><label>Quality</label><select><option>Grade A • Fresh</option><option>Grade B • Good</option></select></div><div><label>${t("loc")}</label><input id="ploc" value="${esc(s.farmer?.loc||"")}"></div></div><div class="actions-row"><button class="btn primary" onclick="runAI()">${t("cont")} → AI</button></div></div>`}
async function runAI(){let crop=document.getElementById("crop").value,q=+document.getElementById("q").value;if(q<1){toast("Enter valid quantity");return}let price=crops[crop][2];try{let r=await fetch(API+"/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({farmer:s.farmer.name,crop,quantity:q})});if(r.ok)price=+(await r.json()).fair_price||price}catch(e){}s.ai={crop,qty:q,price,loc:document.getElementById("ploc").value};screen("ai")}
function ai(){let a=s.ai;return `<button class="back" onclick="screen('listing')">← ${t("back")}</button><div class="steps"><span class="step done">✓ 1</span><span class="step done">✓ 2</span><span class="step on">3. AI</span><span class="step">4. ${t("orders")}</span><span class="step">5. Logistics</span><span class="step">6. Payment</span></div><div class="banner"><div class="title"><div><h2>${t("ai")}</h2><p>Demo AI market recommendation based on crop and quantity.</p></div><span style="font-size:50px">${crops[a.crop][0]}</span></div><div class="grid three"><div class="metric"><small>${t("fair")}</small><b>${money(a.price)}/kg</b></div><div class="metric"><small>${t("demand")}</small><b>High</b></div><div class="metric"><small>${t("earn")}</small><b>${money(a.price*a.qty)}</b></div></div><div class="actions-row"><button class="btn primary" onclick="publish()">${t("publish")}</button></div></div>`}

function cards(ps){return ps.map(p=>`<article class="card prod"><div class="pic">${crops[p.crop]?.[0]||"🌾"}</div><div class="prod-body"><div class="prod-top"><div><b>${esc(p.crop)}</b><div class="muted">👨‍🌾 ${esc(p.farmer)}</div></div><span class="verified">✓ VERIFIED</span></div><div class="muted" style="margin-top:8px">${esc(p.loc||"Local farm")} • ${p.quantity} kg available</div><div class="prod-foot"><span class="smallprice">${money(p.price)}<small>/kg</small></span><button class="btn primary" onclick="openP('${p.id}')">${t("add")}</button></div></div></article>`).join("")||`<div class="card">No products found.</div>`}
function filter(){let q=(document.getElementById("search").value||"").toLowerCase();document.getElementById("pg").innerHTML=cards(products().filter(p=>(p.crop+" "+p.farmer+" "+p.loc).toLowerCase().includes(q)))}
function cat(c,e){document.querySelectorAll(".lang .chip").forEach(x=>x.classList.remove("on"));e.classList.add("on");document.getElementById("pg").innerHTML=cards(products().filter(p=>c==="All"||crops[p.crop][1]===c))}
function openP(id){let p=products().find(x=>x.id===id);document.getElementById("modal").innerHTML=`<div class="modal" onclick="closeM()"><div class="card" onclick="event.stopPropagation()"><div style="font-size:75px;text-align:center">${crops[p.crop][0]}</div><h2>${p.crop}</h2><p>From ${p.farmer} • ${p.loc}</p><div class="price">${money(p.price)}/kg</div><label>Quantity (kg)</label><input id="mq" type="number" min="1" max="${p.quantity}" value="1" oninput="if(+this.value>${p.quantity})this.value=${p.quantity}"><div class="actions-row"><button class="btn primary" style="width:100%" onclick="add('${p.id}')">${t("add")}</button><button class="btn light" style="width:100%" onclick="closeM()">${t("back")}</button></div></div></div>`}
function closeM(){document.getElementById("modal").innerHTML=""}
function add(id){let p=products().find(x=>x.id===id),q=Math.max(1,+document.getElementById("mq").value||1),e=s.cart.find(x=>x.id===id);if(e)e.q=Math.min(e.q+q,p.quantity);else s.cart.push({id,q:Math.min(q,p.quantity)});save();closeM();toast("Added to cart");render()}
function count(){return s.cart.reduce((a,x)=>a+x.q,0)}
function data(){return s.cart.map(x=>({...x,p:products().find(y=>y.id===x.id)})).filter(x=>x.p)}
function totals(){let sub=data().reduce((a,x)=>a+x.q*x.p.price,0);return{sub,del:sub?49:0,total:sub+(sub?49:0)}}
function change(id,d){let x=s.cart.find(a=>a.id===id),p=products().find(a=>a.id===id);x.q=Math.max(0,Math.min(x.q+d,p.quantity));if(!x.q)s.cart=s.cart.filter(a=>a.id!==id);save();render()}
function cart(){let ds=data(),z=totals();return `<button class="back" onclick="screen('consumer')">← ${t("back")}</button><div class="title"><h2>🛒 ${t("cart")}</h2></div>${ds.length?`<div class="grid two"><div class="card">${ds.map(x=>`<div class="cartrow"><div class="thumb">${crops[x.p.crop][0]}</div><div><b>${x.p.crop}</b><div class="muted">${x.p.farmer}</div><b>${money(x.p.price)}/kg</b></div><div class="qty"><button onclick="change('${x.id}',-1)">−</button><b>${x.q}</b><button onclick="change('${x.id}',1)">+</button></div><button class="btn danger remove" onclick="s.cart=s.cart.filter(a=>a.id!=='${x.id}');save();render()">Remove</button></div>`).join("")}<button class="btn light" onclick="screen('consumer')" style="margin-top:15px">← Continue Shopping</button></div><div class="card summary"><h3>Order Summary</h3><div class="summaryline"><span>${t("sub")}</span><b>${money(z.sub)}</b></div><div class="summaryline"><span>${t("delivery")}</span><b>${money(z.del)}</b></div><div class="total"><span>${t("total")}</span><span>${money(z.total)}</span></div><button class="btn primary" style="width:100%;margin-top:18px" onclick="screen('checkout')">${t("checkout")}</button></div></div>`:`<div class="card" style="text-align:center"><div style="font-size:65px">🛒</div><h2>${t("empty")}</h2><button class="btn primary" onclick="screen('consumer')">Browse Marketplace</button></div>`}`}
function checkout(){let z=totals();return `<button class="back" onclick="screen('cart')">← ${t("back")}</button><div class="title"><h2>Checkout</h2></div><div class="grid two"><div class="card"><label>${t("address")}</label><textarea id="addr" rows="5">${esc(s.address)}</textarea><label style="margin-top:15px">${t("slot")}</label><select id="slot"><option>Tomorrow • 9 AM – 12 PM</option><option>Tomorrow • 2 PM – 5 PM</option></select><button class="btn primary" style="width:100%;margin-top:18px" onclick="toPay()">${t("payment")} →</button></div><div class="card"><h3>Order Summary</h3>${data().map(x=>`<div class="summaryline"><span>${x.p.crop} × ${x.q}</span><b>${money(x.q*x.p.price)}</b></div>`).join("")}<div class="total"><span>${t("total")}</span><span>${money(z.total)}</span></div></div></div>`}

function payment(){let z=totals();return `<button class="back" onclick="screen('checkout')">← ${t("back")}</button><div class="title"><div><h2>💳 ${t("payment")}</h2><p>${t("demo")}</p></div></div><div class="card"><div class="payment">${[["upi","📱",t("upi")],["card","💳",t("card")],["cod","💵",t("cod")]].map(x=>`<button class="pay ${s.pay===x[0]?"on":""}" onclick="s.pay='${x[0]}';save();render()">${x[1]}<br><b>${x[2]}</b></button>`).join("")}</div><div style="margin-top:22px">${s.pay==="upi"?`<div class="banner"><h3>UPI Demo</h3><p>Enter any demo ID such as farmer@upi.</p><input placeholder="yourname@upi"><div style="font-size:65px;text-align:center">▦</div></div>`:s.pay==="card"?`<div class="grid two"><div style="grid-column:1/-1"><label>Card Number</label><input placeholder="4111 1111 1111 1111"></div><div><label>Expiry</label><input placeholder="MM/YY"></div><div><label>CVV</label><input placeholder="123" type="password"></div></div>`:`<div class="banner"><h3>Cash on Delivery</h3><p>Pay the delivery partner when your order arrives.</p></div>`}</div><div class="total" style="margin-top:20px"><span>${t("total")}</span><span>${money(z.total)}</span></div><button class="btn primary" style="width:100%;margin-top:18px" onclick="complete()">${s.pay==="cod"?t("confirm"):t("pay")+" "+money(z.total)}</button></div>`}

function advance(){if(s.order)s.order.status=Math.min(4,(s.order.status||0)+1);save();render()}
function dash(){return `<div class="title"><div><h2>👨‍🌾 ${t("dashboard")}</h2><p>Welcome, ${esc(s.farmer?.name||"Farmer")} • ✓ Verified</p></div><button class="btn light" onclick="screen('farmerOrders')">📦 ${t("orders")}</button></div><div class="grid three"><div class="metric"><small>Listed Products</small><b>${s.products.length}</b></div><div class="metric"><small>Potential Earnings</small><b>${money(s.products.reduce((a,p)=>a+p.price*p.quantity,0))}</b></div><div class="metric"><small>Trust</small><b>Verified ✓</b></div></div><div class="title" style="margin-top:30px"><h2>${t("my")}</h2><button class="btn primary" onclick="screen('listing')">+ Add Harvest</button></div><div class="grid two">${s.products.map(p=>`<div class="card"><b>${crops[p.crop][0]} ${p.crop}</b><p class="muted">${p.quantity} kg • ${money(p.price)}/kg • ${p.loc}</p></div>`).join("")||`<div class="card">No products yet.</div>`}</div><div class="actions-row"><button class="btn light" onclick="s.role=null;s.farmer=null;save();screen('roles')">${t("change")}</button></div>`}
function farmerOrders(){return `<button class="back" onclick="screen('dash')">← ${t("back")}</button><div class="title"><h2>📦 ${t("orders")}</h2></div><div class="card">${s.order?`<b>${s.order.id}</b><p class="muted">${s.order.items.map(x=>x.p.crop+" × "+x.q+"kg").join(", ")}</p><span class="verified">Direct Consumer Order</span>`:`<p>No orders yet.</p>`}</div>`}
function toggleVoice(){document.getElementById("voice").classList.toggle("hidden");voiceUI()}
function voiceUI(){let v=document.getElementById("voice");if(!v)return;document.getElementById("vtitle").textContent=t("voice");document.getElementById("vlang").textContent=T[s.lang].n+" • "+T[s.lang].code;document.getElementById("mic").textContent="🎙️ "+t("speak");document.getElementById("hint").textContent=t("hints")}

function listen(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){toast("Use Google Chrome for voice recognition.");return}let r=new R();r.lang=T[s.lang].code;r.interimResults=false;r.continuous=false;document.getElementById("mic").textContent="🎙️ "+t("listening");r.onresult=e=>{let x=e.results[0][0].transcript;document.getElementById("trans").textContent=x;command(x)};r.onerror=()=>{document.getElementById("mic").textContent="🎙️ "+t("speak")};r.onend=()=>{document.getElementById("mic").textContent="🎙️ "+t("speak")};r.start()}
function command(raw){let x=raw.toLowerCase(),resp="";if((x.includes("sell")||x.includes("बेचना")||x.includes("ಮಾರ"))&&s.role==="farmer"){s.screen="listing";resp=s.lang==="kn"?"ಸರಿ. ನಿಮ್ಮ ಬೆಳೆ ವಿವರಗಳನ್ನು ನಮೂದಿಸಿ.":s.lang==="hi"?"ठीक है। अपनी फसल का विवरण भरें।":"Sure. Let's add your harvest."}else if(x.includes("cart")||x.includes("कार्ट")||x.includes("ಕಾರ್ಟ್")){s.screen="cart";resp=s.lang==="kn"?"ನಿಮ್ಮ ಕಾರ್ಟ್ ತೆರೆಯುತ್ತಿದ್ದೇನೆ.":s.lang==="hi"?"आपका कार्ट खोल रही हूँ।":"Opening your cart."}else if(x.includes("order")||x.includes("ऑर्डर")||x.includes("ಆರ್ಡರ್")){s.screen="tracking";resp=s.lang==="kn"?"ಆರ್ಡರ್ ಟ್ರ್ಯಾಕಿಂಗ್ ತೆರೆಯುತ್ತಿದ್ದೇನೆ.":s.lang==="hi"?"ऑर्डर ट्रैकिंग खोल रही हूँ।":"Opening order tracking."}else if(x.includes("tomato")||x.includes("टमाटर")||x.includes("ಟೊಮೇಟೊ")){if(s.screen==="consumer"){let p=products().find(p=>p.crop==="Tomato");if(p)addDirect(p.id);resp=s.lang==="kn"?"ಟೊಮೇಟೊ ಕಾರ್ಟ್‌ಗೆ ಸೇರಿಸಲಾಗಿದೆ.":s.lang==="hi"?"टमाटर कार्ट में जोड़ दिया है।":"Tomatoes added to your cart."}else if(s.screen==="listing"){document.getElementById("crop").value="Tomato";resp=s.lang==="kn"?"ಟೊಮೇಟೊ ಆಯ್ಕೆ ಮಾಡಲಾಗಿದೆ.":s.lang==="hi"?"टमाटर चुना गया है।":"Tomato selected."}}else{resp=s.lang==="kn"?"ಮಾರುಕಟ್ಟೆ, ಕಾರ್ಟ್, ಆರ್ಡರ್ ಅಥವಾ ಮಾರಾಟ ಎಂದು ಹೇಳಿ.":s.lang==="hi"?"मार्केट, कार्ट, ऑर्डर या बेचें कहें।":"Say marketplace, cart, order, or sell."}save();render();speak(resp)}
function addDirect(id){let e=s.cart.find(x=>x.id===id);if(e)e.q++;else s.cart.push({id,q:1});save()}

/* ===== FARMER INVENTORY + LIVE STOCK UPDATE ===== */
function inventoryTotal(){
    return s.products.reduce((a,p)=>a+(Number(p.quantity)||0),0);
}
function updateStock(id, delta){
    const p=s.products.find(x=>x.id===id);
    if(!p) return;
    const next=Math.max(0,(Number(p.quantity)||0)+delta);
    if(next===0){
        if(confirm("This will make the product unavailable. Continue?")){
            p.quantity=0;
        }else return;
    }else{
        p.quantity=next;
    }
    save();
    toast("Available harvest updated");
    render();
}
function setStock(id){
    const p=s.products.find(x=>x.id===id);
    if(!p) return;
    const value=prompt("Enter the new available harvest quantity (kg):",p.quantity);
    if(value===null) return;
    const n=Number(value);
    if(!Number.isFinite(n)||n<0){
        toast("Enter a valid quantity");
        return;
    }
    p.quantity=Math.floor(n);
    save();
    toast("Harvest quantity updated");
    render();
}
function removeProduct(id){
    const p=s.products.find(x=>x.id===id);
    if(!p) return;
    if(confirm("Remove "+p.crop+" from your marketplace?")){
        s.products=s.products.filter(x=>x.id!==id);
        save();
        toast("Product removed from marketplace");
        render();
    }
}

                <button class="btn primary" onclick="updateStock('${p.id}',10)">+ 10 kg</button>
                <button class="btn light" onclick="setStock('${p.id}')">✏️ Edit</button>
                <button class="btn danger" onclick="removeProduct('${p.id}')">Remove</button>
            </div>
            ${available===0?`<div style="background:#fee2e2;color:#991b1b;padding:10px 18px;font-size:12px;font-weight:700">OUT OF STOCK — hidden from consumers</div>`:""}
        </div>`;
    }).join("");

    return `<div class="title">
        <div>
            <h2>👨‍🌾 ${t("dashboard")}</h2>
            <p>Welcome, ${esc(s.farmer?.name||"Farmer")} • ✓ Verified</p>
        </div>
        <button class="btn light" onclick="screen('farmerOrders')">📦 ${t("orders")}</button>
    </div>

    <div class="grid three">
        <div class="metric"><small>Active Listings</small><b>${s.products.filter(p=>Number(p.quantity)>0).length}</b></div>
        <div class="metric"><small>Total Available Harvest</small><b>${inventoryTotal()} kg</b></div>
        <div class="metric"><small>Potential Earnings</small><b>${money(s.products.reduce((a,p)=>a+(Number(p.quantity)||0)*(Number(p.price)||0),0))}</b></div>
    </div>

    <div class="banner" style="margin-top:22px">
        <b>🌱 Harvest Inventory</b>
        <p style="margin:5px 0 0">Increase or decrease your available harvest anytime. Consumers see the updated quantity automatically.</p>
    </div>

    <div class="title" style="margin-top:30px">
        <h2>${t("my")}</h2>
        <button class="btn primary" onclick="screen('listing')">+ Add Harvest</button>
    </div>

    <div class="grid">${rows||`<div class="card" style="text-align:center"><div style="font-size:55px">🌾</div><h3>No harvest listed yet</h3><button class="btn primary" onclick="screen('listing')">List Harvest</button></div>`}</div>

    <div class="actions-row">
        <button class="btn light" onclick="s.role=null;s.farmer=null;save();screen('roles')">${t("change")}</button>
    </div>`;
}

/* Only farmer-created listings can have live stock changed.
   Consumer purchases reduce that farmer listing's quantity. */
function complete(){
    const purchased=data();
    s.order={
        id:"FD-"+Date.now().toString().slice(-8),
        items:purchased,
        total:totals().total,
        address:s.address,
        status:0,
        pay:s.pay
    };

    purchased.forEach(item=>{
        const farmerProduct=s.products.find(p=>String(p.id)===String(item.id));
        if(farmerProduct){
            farmerProduct.quantity=Math.max(0,(Number(farmerProduct.quantity)||0)-item.q);
        }
    });

    s.cart=[];
    save();
    screen("success");
}

/* Hide zero-stock products from consumer marketplace */
function cards(ps){
    const available=ps.filter(p=>Number(p.quantity)>0);
    return available.map(p=>`<article class="card prod">
        <div class="pic">${crops[p.crop]?.[0]||"🌾"}</div>
        <div class="prod-body">
            <div class="prod-top">
                <div><b>${esc(p.crop)}</b><div class="muted">👨‍🌾 ${esc(p.farmer)}</div></div>
                <span class="verified">✓ VERIFIED</span>
            </div>
            <div class="muted" style="margin-top:8px">${esc(p.loc||"Local farm")} • ${p.quantity} kg available</div>
            <div class="prod-foot">
                <span class="smallprice">${money(p.price)}<small>/kg</small></span>
                <button class="btn primary" onclick="openP('${p.id}')">${t("add")}</button>
            </div>
        </div>
    </article>`).join("")||`<div class="card" style="grid-column:1/-1;text-align:center"><div style="font-size:45px">🌾</div><h3>No harvest available right now</h3><p>Farmers will appear here when fresh stock is listed.</p></div>`;
}

/* Never allow a consumer to add more than current farmer stock */
function add(id){
    const p=products().find(x=>String(x.id)===String(id));
    if(!p || Number(p.quantity)<=0){toast("This harvest is out of stock");closeM();return}
    const input=document.getElementById("mq");
    const q=Math.max(1,Math.floor(Number(input?.value)||1));
    const existing=s.cart.find(x=>String(x.id)===String(id));
    const already=existing?existing.q:0;
    if(already+q>Number(p.quantity)){
        toast("Only "+p.quantity+" kg is available");
        return;
    }
    if(existing) existing.q+=q;
    else s.cart.push({id:p.id,q});
    save();closeM();toast("Added to cart");render();
}

render();
</script>
</body>
